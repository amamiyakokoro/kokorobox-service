name: Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional v-prefixed SemVer tag to release"
        required: false
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
        go-version: '1.26'

    - name: Test
      run: go test ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - { goos: darwin, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: darwin, goarch: arm64, output: arm64 }

          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: linux, goarch: arm64, output: arm64 }

          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64-v3 }
          - { goos: windows, goarch: arm64, output: arm64 }

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
        go-version: '1.26'

    - name: Build
      env:
        GOOS: ${{matrix.jobs.goos}}
        GOARCH: ${{matrix.jobs.goarch}}
        GOAMD64: ${{matrix.jobs.goamd64}}
        CGO_ENABLED: 0
      run: |
        go env
        if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
          artifact=kokorobox-service-${{matrix.jobs.goos}}-${{matrix.jobs.output}}.exe
        else
          artifact=kokorobox-service-${{matrix.jobs.goos}}-${{matrix.jobs.output}}
        fi
        go build -trimpath -ldflags "-extldflags --static -w -s -buildid=" -o "$artifact"
        sha256sum "$artifact" > "$artifact.sha256"

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
        path: |
          kokorobox-service-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}*

  pre-release:
    if: >-
      github.event_name != 'pull_request' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      !(github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: pre-release
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Prerelease
        uses: softprops/action-gh-release@v3
        if: ${{  success() }}
        with:
          tag_name: pre-release
          files: |
            bin/*
          prerelease: true

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Check existing release and tag
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              throw new Error(`Release ${tag} already exists and cannot be replaced.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const { data } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: `refs/tags/${tag}`
              });
              if (data.sha !== context.sha) {
                throw new Error(`Tag ${tag} points to a different commit.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            bin/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
